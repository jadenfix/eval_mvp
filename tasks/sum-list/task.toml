schema_version = "1.4"
artifacts = ["/app"]

[agent]
timeout_sec = 120

[environment]
build_timeout_sec = 300
cpus = 1
memory_mb = 1024
network_mode = "public"

[verifier]
environment_mode = "separate"
timeout_sec = 30

[verifier.environment]
cpus = 1
memory_mb = 1024
network_mode = "public" # Docker Compose below disables verifier networking.
